<!DOCTYPE html>
<html lang="ko">
<link rel="stylesheet" href="chatbot.css">
<link rel="stylesheet" href="sidebar.css">

<head>
    <meta charset="UTF-8"/>
    <title>챗봇</title>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
</head>
<body>

    <div class="toggle">
        <ion-icon name="menu-outline" class="open"></ion-icon>
        <ion-icon name="close-outline" class="close"></ion-icon>
    </div>
    
    <div class="navigation">
        <ul>
            <li class="list active">
                <b></b>
                <b></b>
                <a href="main.html">
                    <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                    <span class="title">MAIN</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="info.html">
                    <span class="icon"><ion-icon name="person-circle-outline"></ion-icon></span>
                    <span class="title">PROFILE</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="chatbot.html">
                    <span class="icon"><ion-icon name="chatbubble-ellipses-outline"></ion-icon></span>
                    <span class="title">CHAT</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="https://www.youtube.com/playlist?list=PLtJ9I_0y7eIDsJhJdYkcE2c-KaBqvHY0v">
                    <span class="icon"><ion-icon name="logo-youtube"></ion-icon></span>
                    <span class="title">MEDIA</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="chatBotPage">
        <div id='topText'></div>
        <div class="talkBox" id="talk">궁금하신게 있으시면 말씀해 주세요~~</div>
        <div>
            <img src="comments.png">
        </div>
        <div>
            <input class = "inputText" type="text" id="console" content name="content">
        </div>
        <div>
            <button class = "submitBtn" id="btnSend" type="button">말하기</button>
        </div>
        
    </div>

    <script>
        let list = document.querySelectorAll('.list');

        for(let i=0; i < list.length; i++){
            list[i].onclick = function() {
                let j=0;
                while(j < list.length){
                    list[j++].className = 'list';
                }
                list[i].className = 'list active';
            }
        }
        // 
        let menuToggle = document.querySelector('.toggle');
        let navigation = document.querySelector('.navigation');

        menuToggle.onclick = function() {
            menuToggle.classList.toggle('active')
            navigation.classList.toggle('active')
        }
    </script>
    
    <script src="chatbot.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
