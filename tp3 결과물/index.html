<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing</title>

  <style>
    .typing {
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      font-size: 1.8rem;
      text-align: center;
      
    }

    .text {
      width: 500px;
      font-size: 2.2rem;
    }

    .text::after {
      content: '';
      margin-left: .4rem;
      border-right: 2px solid #777777;
      animation: cursor .9s infinite steps(2);
    }

    @keyframes cursor {
      from { border-right: 2px solid white; }
      to { border-right: 2px solid #2f8cf0; }
    }

    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

    * {
      margin: 0;
      padding: 0;
      list-style: none;
      box-sizing: border-box;  
      font-family: Pretendard;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #2f8cf0;
      color: white;
    }

    img {
      width: 60px;
      height: 60px;
    }

    button {
      background-color: #2f8cf0;
      border: #2f8cf0;
      margin: 36px;
    }
  </style>

</head>
<body>
  <div class='typing'><h1 class="text"></h1></div>
  <button><a href="main.html"><img src="into.png"></a></button>

  <script>
      window.onload = function() {
        var name = prompt("성함을 입력 해 주세요:");
      
      
      const $text = document.querySelector(".typing .text");

      const letters = [
        "환영합니다! " + name + "님",
        "여기는 인트로 페이지 입니다.", 
        "저에 대해 궁금하시다면 \n 아래의 버튼을 눌러주세요!"
      ];

      const speed = 100;
      let i = 0;

      const changeLineBreak = (letter) => {
        return letter.map(text => text === "\n" ? "<br>" : text);
      }

      const typing = async () => {  
        const letter = changeLineBreak(letters[i].split(""));
        
        while (letter.length) {
          await wait(speed);
          $text.innerHTML += letter.shift(); 
        }
        
        await wait(800);
        
        remove();
      }

      const remove = async () => {
        const letter = changeLineBreak(letters[i].split(""));
        
        while (letter.length) {
          await wait(speed);
          
          letter.pop();
          $text.innerHTML = letter.join(""); 
        }
        
        i = !letters[i+1] ? 0 : i + 1;
        typing();
      }

      function wait(ms) {
        return new Promise(res => setTimeout(res, ms))
      }

      setTimeout(typing, 1500);
    };
  </script>

</body>

</html>
